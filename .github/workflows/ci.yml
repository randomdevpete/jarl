name: CI

# GitHub Actions CI for the jarl-react v2 rewrite, replacing the old
# CircleCI + Now (Zeit) pipeline. See docs/legacy-ci.md for a full record of
# what that pipeline used to do (build/test/deploy steps, caching, secrets)
# so nothing gets silently lost in the switch.
#
# IMPORTANT — this workflow is EXPECTED TO FAIL for a while:
#
# It calls the *conventional* v2 scripts (`npm run build`, `npm test`,
# `npm run test:e2e`) that several sibling tickets are introducing in
# parallel (51 tooling, 52 TS conversion, 54 atoms core, 55 bindings, 57
# Playwright e2e port). Until those land on master those scripts may not
# exist yet, or may fail. That's expected and by design, not a regression
# to chase down here.
#
# Do NOT add this workflow as a required status check in branch protection
# yet (branch protection is a repo setting anyway, out of scope for this
# workflow file) — turning the whole pipeline green is itself the milestone
# that marks the v2 rewrite as substantially complete.
#
# The `release` job (ticket 106) runs `npm run release` (semantic-release)
# after `build-and-test`, on every push to master — semantic-release itself
# decides from Conventional Commits since the last release tag whether a
# release is actually warranted, so the job is safe to run unconditionally
# and no-ops when nothing qualifies. See docs/release-strategy.md for the
# full pipeline and the `release` job's own inline comments below for the
# two one-time owner (repo-admin) actions it depends on: creating the
# `NPM_TOKEN` secret, and pushing the one-time `v2.0.0` baseline tag.
#
# Ticket 140 extends the same job to also run on pushes to a long-lived
# `beta` branch. `.releaserc.json` configures `beta` as a semantic-release
# prerelease branch, so a push there computes `2.0.0-beta.N` (etc.)
# increments and publishes them under the npm `beta` dist-tag rather than
# `latest` — the same job, same pipeline, just a different outcome driven by
# which branch triggered it. See "Beta prerelease branch" in
# docs/release-strategy.md.

on:
  push:
    branches: [master, beta]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    needs: build-and-test
    # The Playwright e2e suite is being ported from the old Cypress suite by
    # ticket 57, in parallel with this one. Until that lands, `npm run
    # test:e2e` may not exist yet, or may fail for reasons unrelated to this
    # workflow. continue-on-error keeps that from failing the whole run in
    # the interim — flip it off once ticket 57 has merged and the suite is
    # reliably runnable.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run e2e tests
        run: npm run test:e2e

  release:
    name: Release (semantic-release)
    runs-on: ubuntu-latest
    needs: [build-and-test]
    # Only ever run on a push to master or beta on the main repo — never on a
    # PR build (semantic-release refuses to run there anyway, but there's no
    # reason to even attempt it) and never on a fork (a fork's own
    # master/beta branch would otherwise also match `on.push.branches` above
    # and try to release using this repo's secrets, which won't exist
    # there). Both branches share this one job: `.releaserc.json`'s
    # branch config is what decides whether a given push produces a normal
    # release (master) or a `-beta.N` prerelease under the `beta` npm
    # dist-tag (beta) — see docs/release-strategy.md.
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/beta') &&
      github.repository == 'downplay/jarl-react'
    # semantic-release needs contents:write to push the release commit + tag,
    # and issues:write/pull-requests:write so @semantic-release/github can
    # comment on issues/PRs referenced by release notes. See
    # docs/release-strategy.md for the full pipeline (commit-analyzer,
    # release-notes-generator, changelog, npm x2, git, github).
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release needs the full commit history and all tags to
          # find the last release tag and compute the next version from
          # Conventional Commits since then — a shallow checkout would only
          # see the most recent commit.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Runs the shared semantic-release pipeline from the root .releaserc.json
      # (see docs/release-strategy.md): computes the next version from
      # Conventional Commits since the last `vX.Y.Z` tag, and if a release is
      # warranted, bumps+publishes both packages' package.json in lockstep,
      # updates CHANGELOG.md, tags, and creates a GitHub release. No-ops
      # cleanly (exit 0, nothing published) when nothing on master since the
      # last release warrants one — that's why this job runs unconditionally
      # on every master push rather than needing its own release-detection
      # logic.
      #
      # Two owner (repo-admin) actions are required before this can actually
      # publish anything, neither of which this PR can perform:
      #
      #   1. Create an `NPM_TOKEN` repository secret — an npm automation/
      #      publish token with publish rights to both `jarl-atoms` and
      #      `jarl-react` on the registry. (`GH_TOKEN`/`GITHUB_TOKEN` needs no
      #      setup — the default `secrets.GITHUB_TOKEN`, scoped by the
      #      `permissions:` block above, is sufficient.)
      #   2. Push the one-time `v2.0.0` baseline tag on master (see
      #      "One-time bootstrap" in docs/release-strategy.md) — without it
      #      the first run computes its bump from the old `v1.0.0-beta.5` tag
      #      instead of the v2 baseline. This same tag also gates the first
      #      `beta` branch run (see "Beta prerelease branch" in
      #      docs/release-strategy.md): `beta` is expected to be branched
      #      from master *after* the tag exists, so it's an ancestor either
      #      way — no separate beta-only bootstrap tag is needed.
      #
      # Also blocked, independently of the above: GitHub Actions is
      # billing-locked for this repo (ticket 82), so this job — like every
      # other job in this workflow — is expected to show as failed/not-run
      # until that's resolved.
      #
      # Recommended upgrade path once this is running reliably: npm trusted
      # publishing (OIDC, no long-lived NPM_TOKEN) via `npm publish
      # --provenance` and registry-side "Trusted Publisher" config — see
      # https://docs.npmjs.com/trusted-publishers. @semantic-release/npm
      # doesn't yet drive OIDC itself, so adopting it would mean swapping the
      # publish step rather than just adding config here; left as a follow-up
      # rather than implemented in this ticket so the boring, well-understood
      # NPM_TOKEN path ships first.
      - name: Release
        run: npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # actions/setup-node's registry-url above writes an .npmrc that
          # reads the auth token from NODE_AUTH_TOKEN; @semantic-release/npm
          # separately looks for NPM_TOKEN itself when it writes its own
          # .npmrc. Setting both covers whichever one is actually consulted.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy (placeholder — not yet implemented)
    runs-on: ubuntu-latest
    needs: [build-and-test]
    # Deploy target is undecided as of ticket 60 — probably AWS, served as a
    # subdomain of the randomdev business site (ticket 58 builds the site
    # this will eventually deploy; ticket 50 is the parent v2 epic tracking
    # the hosting decision). Intentionally disabled via `if: false` so it
    # never runs and never reports a false pass/fail — this job is where the
    # real deploy steps will hang once the target service is chosen.
    if: false
    steps:
      - name: Deploy target not yet decided
        run: |
          echo "Placeholder job — no deploy steps written yet."
          echo "See docs/legacy-ci.md for what the old Now (Zeit) deploy did,"
          echo "and ticket 58/60 on the TODOS board for the new target."
