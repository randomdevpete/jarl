name: CI

# GitHub Actions CI for the jarl-react v2 rewrite, replacing the old
# CircleCI + Now (Zeit) pipeline. See docs/legacy-ci.md for a full record of
# what that pipeline used to do (build/test/deploy steps, caching, secrets)
# so nothing gets silently lost in the switch.
#
# IMPORTANT — this workflow is EXPECTED TO FAIL for a while:
#
# It calls the *conventional* v2 scripts (`npm run build`, `npm test`,
# `npm run test:e2e`) that several sibling tickets are introducing in
# parallel (51 tooling, 52 TS conversion, 54 atoms core, 55 bindings, 57
# Playwright e2e port). Until those land on master those scripts may not
# exist yet, or may fail. That's expected and by design, not a regression
# to chase down here.
#
# Do NOT add this workflow as a required status check in branch protection
# yet (branch protection is a repo setting anyway, out of scope for this
# workflow file) — turning the whole pipeline green is itself the milestone
# that marks the v2 rewrite as substantially complete.
#
# The `release` job runs `npm run release` (semantic-release) after
# `build-and-test`, and ONLY when the workflow is dispatched by hand with the
# `release` input ticked — never automatically on a push. Releasing is a
# deliberate decision about when enough has accumulated to be worth cutting.
# `.releaserc.json` decides
# what each branch produces: a normal release on master, a `-beta.N` prerelease
# under the npm `beta` dist-tag on beta. See docs/release-strategy.md for the
# full pipeline, the cadence rationale, and the two one-time owner (repo-admin)
# actions it depends on: configuring npm trusted publishing, and pushing the
# one-time `v2.0.0` baseline tag.

on:
  push:
    branches: [master, beta]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Release everything outstanding since the last tag"
        type: boolean
        default: false

jobs:
  build-and-test:
    name: Build, unit test & infra synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      # infra/ is a standalone npm project, absent from the root `workspaces`,
      # so the root `npm ci` above installs none of it and none of the checks
      # above read it.
      - name: Install infra dependencies
        working-directory: infra
        run: npm ci

      - name: Typecheck infra
        working-directory: infra
        run: npm run typecheck

      # This job holds no AWS credentials, which is the property being checked:
      # synth has to resolve everything without reading the account.
      - name: Synth infra
        working-directory: infra
        run: npx cdk synth --quiet
  commitlint:
    name: Lint commit messages
    runs-on: ubuntu-latest
    # A push to master lands the same commits a PR already carries via
    # rebase-merge, so linting the PR's range is what gates master.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          # Needs the base commit and everything since it, not just HEAD.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint commits since the PR's base
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    needs: build-and-test
    # Ticket 57 ported the Playwright e2e suite and ticket 82 verified it
    # green locally (22 passed, 10 test.fixme). Ticket 155 removed
    # continue-on-error now that the suite is real and reliably runnable —
    # a failing e2e test fails this job, and this job failing fails the run.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install e2e dependencies
        # e2e/ is a standalone package (see its own package.json), not an
        # npm workspace, so the root `npm ci` above never installs it. Its
        # own lockfile is e2e/package-lock.json.
        run: npm ci --prefix e2e

      - name: Install Playwright browsers
        run: npx --prefix e2e playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

  registry-smoke:
    name: Registry smoke test (packed local build)
    runs-on: ubuntu-latest
    needs: build-and-test
    # Ticket 823: this used to install from the npm registry at `latest`, gated behind
    # workflow_dispatch only — so a source rename here couldn't fail until the next release
    # republished, in a job nobody was watching. It now packs jarl-atoms/jarl-react from this
    # commit as `npm pack` would for a release and installs those tarballs as a real npm
    # dependency (see e2e/registry-smoke/README.md, "Tracking source renames"), so drift shows up
    # on the PR that introduced it instead of after a release ships broken.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pack local build and install the smoke consumer
        run: npm run test:smoke:install

      - name: Run the smoke consumer
        run: npm run test:smoke

  release:
    name: Release (semantic-release)
    runs-on: ubuntu-latest
    needs: [build-and-test]
    # Never on a PR build (semantic-release refuses to run there anyway) and
    # never on a fork — a fork's own master/beta branch would otherwise match
    # `on.push.branches` above and try to release with secrets that don't exist
    # there. This only decides the job may run; whether it actually releases is
    # the `Decide whether to release` step below.
    if: |
      github.repository == 'randomdevpete/jarl' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/beta') &&
      github.event_name == 'workflow_dispatch' && inputs.release
    # Two semantic-release runs at once would race the release tag and the two
    # npm publishes; queue them instead. cancel-in-progress stays false so a
    # release already mid-publish always finishes.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    # semantic-release needs contents:write to push the release commit + tag,
    # and issues:write/pull-requests:write so @semantic-release/github can
    # comment on issues/PRs referenced by release notes. See
    # docs/release-strategy.md for the full pipeline (commit-analyzer,
    # release-notes-generator, changelog, npm x2, git, github).
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # Lets npm exchange the job's OIDC token for a publish credential
      # (trusted publishing) and sign provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          # semantic-release needs the full commit history and all tags to
          # find the last release tag and compute the next version from
          # Conventional Commits since then — a shallow checkout would only
          # see the most recent commit.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Trusted publishing needs npm >= 11.5.1 (Node 24 bundles a newer npm,
      # but fail early rather than at publish time if that ever regresses).
      - name: Check npm supports trusted publishing
        run: |
          v=$(npm --version)
          echo "npm $v"
          [ "$(printf '%s\n' 11.5.1 "$v" | sort -V | head -n1)" = 11.5.1 ] || npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Runs the shared semantic-release pipeline from the root .releaserc.json
      # (see docs/release-strategy.md): computes the next version from
      # Conventional Commits since the last `vX.Y.Z` tag, bumps+publishes both
      # packages' package.json in lockstep, updates CHANGELOG.md, tags, and
      # creates a GitHub release.
      #
      # Publishing uses npm trusted publishing (OIDC): no NPM_TOKEN. Each
      # published package needs a Trusted Publisher on npmjs.com (repo
      # randomdevpete/jarl, workflow ci.yml, no environment). Provenance is
      # generated automatically. Do not set NPM_TOKEN/NODE_AUTH_TOKEN: a stale
      # token would take precedence over OIDC. See docs/release-strategy.md.
      # The one-time `v2.0.0` baseline tag is also required (see "One-time
      # bootstrap" in docs/release-strategy.md).
      - name: Release
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Stops `npm version` re-resolving workspace deps from the registry,
          # where a first-ever release of an internal package doesn't exist yet.
          npm_config_workspaces_update: "false"

  deploy:
    name: Deploy (infra + site content)
    runs-on: ubuntu-latest
    needs: [build-and-test, e2e, release]
    # Deploys https://jarl.randomdev.co.uk from master, on a push and on a
    # workflow_dispatch, once the test jobs pass: `cdk deploy --all` for the
    # three stacks (a fast no-op when nothing in infra/ changed), then the
    # content publish from infra/README.md
    # "Publishing site content" — the bucket is deliberately filled by
    # `aws s3 sync`, not a CDK BucketDeployment, so synth never depends on the
    # docs build. Last, "Roll SSR server" ships packages/docs/dist-ssr onto the
    # JarlSsr instance over SSM Run Command and restarts it — see "Rolling the
    # SSR server" in infra/README.md.
    #
    # Same fork guard as `release`: a fork's master would match on.push, but
    # the OIDC role trusts only randomdevpete/jarl, so don't even attempt it.
    #
    # `release` is a dependency so a dispatch that ticks it deploys the version
    # it just cut rather than the one before. It is skipped on a push and on an
    # unticked dispatch, and a skipped dependency fails the implicit
    # `success()`, so `!cancelled()` replaces that and every result is then
    # checked by hand — a failed or cancelled `release` still blocks the deploy.
    if: |
      !cancelled() &&
      github.repository == 'randomdevpete/jarl' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.build-and-test.result == 'success' &&
      needs.e2e.result == 'success' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    # Two deploys interleaving would race CloudFormation and the sync; queue
    # them instead. cancel-in-progress stays false so a deploy that already
    # started always runs to completion.
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      # The AWS credentials come from GitHub's OIDC provider assuming the
      # ticket-278 deploy role — no long-lived keys. id-token is what lets
      # configure-aws-credentials mint the web identity token.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          # The branch tip, not the SHA the run started from: `release` pushes
          # its `chore(release): <version>` commit mid-run, and the docs site
          # compiles CHANGELOG.md in (packages/docs/src/pages/changelogEntries.ts),
          # so the default pinned SHA would publish a site missing the release
          # the same run just cut.
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages and docs site
        run: npm run build

      - name: Install infra dependencies
        # infra/ is a standalone npm project (see its README), never installed
        # by the root `npm ci`.
        run: npm ci --prefix infra

      - name: Configure AWS credentials (OIDC)
        # v6 runs on node24; v5 declares the deprecated node20 and warns on every deploy.
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Deploy stacks
        working-directory: infra
        # --require-approval never: CI has no terminal to confirm the IAM/SG
        # changes cdk pauses on interactively. JarlDomain's us-east-1 placement
        # rides on each stack's own `env`, not this job's default region.
        run: npx cdk deploy --all --require-approval never

      - name: Publish site content
        # Straight from infra/README.md: --delete retires pages dropped from
        # the build, and the invalidation makes new HTML visible ahead of the
        # five-minute page TTL.
        run: |
          bucket=$(aws cloudformation describe-stacks --stack-name JarlStaticSite \
            --query 'Stacks[0].Outputs[?ExportName==`JarlSiteBucketName`].OutputValue' --output text)
          dist_id=$(aws cloudformation describe-stacks --stack-name JarlStaticSite \
            --query 'Stacks[0].Outputs[?ExportName==`JarlDistributionId`].OutputValue' --output text)
          aws s3 sync packages/docs/dist "s3://$bucket" --delete
          aws cloudfront create-invalidation --distribution-id "$dist_id" --paths '/*'

      - name: Roll SSR server
        # Uses SSM Run Command (no SSH inbound). Fails if the roll doesn't leave the
        # instance answering /healthz locally, or if /ssr/ isn't 200 through the
        # distribution within 2 minutes.
        run: |
          bundle_bucket=$(aws cloudformation describe-stacks --stack-name JarlSsr \
            --query 'Stacks[0].Outputs[?ExportName==`JarlSsrBundleBucketName`].OutputValue' --output text)
          instance_id=$(aws cloudformation describe-stacks --stack-name JarlSsr \
            --query 'Stacks[0].Outputs[?ExportName==`JarlSsrInstanceId`].OutputValue' --output text)

          tar czf /tmp/jarl-ssr-bundle.tar.gz -C packages/docs/dist-ssr .
          aws s3 cp /tmp/jarl-ssr-bundle.tar.gz "s3://$bundle_bucket/jarl-ssr-bundle.tar.gz"

          cat > /tmp/roll-ssr.sh <<SCRIPT
          set -euo pipefail
          aws s3 cp --region eu-west-2 s3://$bundle_bucket/jarl-ssr-bundle.tar.gz /tmp/jarl-ssr-bundle.tar.gz
          rm -rf /opt/jarl-ssr/*
          tar xzf /tmp/jarl-ssr-bundle.tar.gz -C /opt/jarl-ssr
          chown -R ec2-user:ec2-user /opt/jarl-ssr
          rm /tmp/jarl-ssr-bundle.tar.gz
          systemctl restart jarl-ssr
          # Type=simple: the restart above returns 0 as soon as node is forked, so a server
          # that dies on its first import still reads as a clean roll. Wait for it to serve.
          for attempt in \$(seq 1 15); do
            if curl -fsS -o /dev/null http://localhost:3000/healthz; then
              exit 0
            fi
            sleep 2
          done
          echo "jarl-ssr did not answer /healthz on the instance after the restart" >&2
          systemctl status jarl-ssr --no-pager --full >&2 || true
          journalctl -u jarl-ssr --no-pager --lines 50 >&2 || true
          exit 1
          SCRIPT
          jq -n --rawfile script /tmp/roll-ssr.sh '{commands: [$script]}' > /tmp/ssm-params.json

          command_id=$(aws ssm send-command --document-name AWS-RunShellScript \
            --targets "Key=InstanceIds,Values=$instance_id" --parameters file:///tmp/ssm-params.json \
            --query 'Command.CommandId' --output text)

          if ! aws ssm wait command-executed --command-id "$command_id" --instance-id "$instance_id"; then
            aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance_id" \
              --query '{Status: Status, Stdout: StandardOutputContent, Stderr: StandardErrorContent}'
            echo "::error::jarl-ssr roll command failed on $instance_id — see invocation output above"
            exit 1
          fi

          status=""
          for attempt in $(seq 1 24); do
            status=$(curl -s -o /dev/null -w '%{http_code}' https://jarl.randomdev.co.uk/ssr/ || true)
            if [ "$status" = "200" ]; then
              break
            fi
            sleep 5
          done
          if [ "$status" != "200" ]; then
            echo "::error::jarl-ssr did not answer /ssr/ with 200 after the roll (last status: $status)"
            exit 1
          fi
