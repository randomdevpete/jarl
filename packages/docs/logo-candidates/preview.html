<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>jarl logo candidates</title>
    <style>
      body {
        background: #170f0a;
        color: #c98a6e;
        font-family: Georgia, serif;
        padding: 24px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 32px;
        margin-bottom: 40px;
      }
      .name {
        width: 260px;
        font-size: 14px;
        color: #ff6b52;
      }
      img {
        display: block;
      }
      .tab {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #2a2a2e;
        color: #ddd;
        font: 12px sans-serif;
        padding: 4px 10px;
        border-radius: 8px 8px 0 0;
      }
      .tab img {
        width: 16px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 28px;
        color: #e8a33d;
        letter-spacing: 2px;
      }
      .brand img {
        width: 34px;
      }
    </style>
  </head>
  <body>
    <script>
      const candidates = [
        "nasal-helm.svg",
        "spectacle-helm-narrow-nasal.svg",
        "spectacle-helm-broad-nasal.svg",
        "shield-boss.svg",
        "longship.svg",
        "jera-rune.svg",
      ];
      const sizes = [16, 32, 64, 128];

      document.body.innerHTML = candidates
        .map(
          (file) => `
            <div class="row">
              <div class="name">${file}</div>
              <span class="tab"><img src="${file}" alt="" /> jarl docs</span>
              ${sizes.map((size) => `<img src="${file}" width="${size}" alt="" />`).join("")}
              <span class="brand"><img src="${file}" alt="" /> JARL</span>
            </div>`,
        )
        .join("");
    </script>
  </body>
</html>
